<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Budget House</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: cozy and playful, like a dollhouse you can poke at
   IDEA: an isometric diorama where every bill lives in an object, savings grow in a tended garden, and the emergency fund fills a water tower
   PICTURE: full-screen 2.5D cutaway house with six rooms, yard, garden, gardener and water tower in soft pastel light
   COLOUR and TYPE: blush, lavender, mint and butter; Fredoka rounded
   LAYOUT: the scene fills the screen; HUD floats on top; details and the budget editor open in a sheet */
:root{color-scheme:light;--ink:#3b3350;--soft:#6c6386;--card:#fffaf7;--mint:#3fb68d;--mintbg:#dcf5ea;--coral:#e8606c;--coralbg:#fde1e3;--lav:#b9a7ea;--water:#4f9fe0;--line:#efe7f2}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden}
body{font:16px/1.45 Fredoka,ui-rounded,"Segoe UI",system-ui,sans-serif;color:var(--ink);background:linear-gradient(165deg,#e7e0fb 0%,#f8dde7 55%,#fde8da 100%)}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block;outline:none}
.hud{position:fixed;left:0;right:0;top:0;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;pointer-events:none}
.hud>*{pointer-events:auto}
.brand h1{margin:0;font-size:32px;line-height:1.05;font-weight:700;text-shadow:0 0 14px #fff,0 0 4px #fff}
.brand p{margin:3px 0 0;color:var(--soft);font-size:14px}
.months{display:flex;background:#ffffffb3;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:4px;box-shadow:0 6px 20px #7a5fb022}
.months button,.tabs button{font:inherit;font-weight:600;border:0;background:none;color:var(--soft);padding:0 18px;height:40px;border-radius:999px;cursor:pointer}
.months button[aria-pressed=true],.tabs button[aria-pressed=true]{background:var(--ink);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
.stats{flex-basis:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-width:620px}
.stat{background:#ffffffb8;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:16px;padding:7px 12px;box-shadow:0 6px 20px #7a5fb01a}
.stat span{display:block;font-size:13px;color:var(--soft)}
.stat b{font-size:20px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.stat.saved b{color:var(--mint)}.stat.neg b{color:var(--coral)}
.bar{position:fixed;left:max(16px,env(safe-area-inset-left));right:16px;bottom:max(16px,env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:8px;align-items:center;pointer-events:none;transition:opacity .25s}
.bar>*{pointer-events:auto}
.hint{background:#ffffffc4;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:9px 14px;font-size:14px;color:var(--soft);box-shadow:0 6px 20px #7a5fb01a}
.hint b{color:var(--coral);font-weight:600}
.btn{font:inherit;font-weight:600;border:0;border-radius:999px;min-height:44px;padding:0 18px;background:var(--ink);color:#fff;cursor:pointer;box-shadow:0 6px 20px #3b335026}
.btn.ghost{background:#f2edf8;color:var(--ink);box-shadow:none}
.btn.danger{background:var(--coralbg);color:#b23642;box-shadow:none}
.btn.sm{min-height:40px;padding:0 14px;font-size:15px}
.tag-sample{font-size:13px;color:var(--soft);background:#ffffff8c;border-radius:999px;padding:4px 10px}
.sheet{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));width:min(460px,calc(100% - 24px));max-height:64vh;overflow:auto;transform:translate(-50%,calc(100% + 60px));transition:transform .38s cubic-bezier(.2,.9,.3,1.15);background:var(--card);border-radius:26px;box-shadow:0 20px 60px #5a3f8a3d;padding:16px 20px 20px;overscroll-behavior:contain}
.sheet.open{transform:translate(-50%,0)}
.sheet.wide{max-height:78vh}
body.sheet-open .bar{opacity:0;pointer-events:none}
body.sheet-open .bar>*{pointer-events:none}
@media(min-width:900px){
 .sheet{left:auto;right:20px;top:50%;bottom:auto;max-height:calc(100vh - 40px);transform:translate(calc(100% + 60px),-50%)}
 .sheet.open{transform:translate(0,-50%)}
 .sheet.wide{width:min(540px,calc(100% - 40px));max-height:calc(100vh - 40px)}
 body.sheet-open .bar{opacity:1}
 body.sheet-open .bar>*{pointer-events:auto}
}
.sh-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:#efe9fb;color:#5b4a8f}
.x{width:44px;height:44px;border:0;border-radius:50%;background:#f2edf8;color:var(--ink);font:600 22px/1 Fredoka,sans-serif;cursor:pointer;flex:none}
.sheet h2{margin:6px 0 0;font-size:28px;line-height:1.1;font-weight:700}
.sheet h3{margin:18px 0 8px;font-size:16px;font-weight:600}
.where{margin:2px 0 12px;color:var(--soft);font-size:15px}
.big{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.big b{font-size:44px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.pill{font-size:14px;font-weight:600;border-radius:999px;padding:4px 10px;white-space:nowrap}
.pill.ok{background:var(--mintbg);color:#1f7d5c}.pill.over{background:var(--coralbg);color:#b23642}
.meter{height:12px;border-radius:99px;background:#efe9f5;margin:14px 0 4px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--mint)}
.meter.over i{background:var(--coral)}.meter.water i{background:var(--water)}
.sub{margin:0;color:var(--soft);font-size:14px}
.hist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end;height:116px;margin:16px 0 4px}
.hist div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px;font-size:13px;color:var(--soft)}
.hist em{font-style:normal;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.hist i{display:block;width:100%;max-width:64px;border-radius:10px 10px 4px 4px;background:#e4dbf6}
.hist .cur i{background:var(--lav)}.hist .cur{color:var(--ink);font-weight:600}
.note{margin:12px 0 0;padding:10px 12px;background:#fbf3ee;border-radius:14px;font-size:15px}
.tabs{display:flex;background:#f2edf8;border-radius:999px;padding:4px;margin:12px 0 4px}
.tabs button{flex:1;padding:0 8px}
.money{position:relative;margin:14px 0 4px}
.money .track{display:flex;height:34px;border-radius:12px;overflow:hidden;background:#f1ecf6}
.money .seg{height:100%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#3b3350cc;border-right:2px solid var(--card);cursor:pointer;overflow:hidden;white-space:nowrap}
.money .seg:last-child{border-right:0}
.money .left{background:repeating-linear-gradient(45deg,#f1ecf6,#f1ecf6 6px,#e6dfee 6px,#e6dfee 12px)}
.ticks{display:grid;grid-template-columns:repeat(10,1fr);height:8px;margin-top:4px}
.ticks i{border-left:1px solid #cfc6dc}.ticks i:last-child{border-right:1px solid #cfc6dc}
.tickl{display:flex;justify-content:space-between;font-size:12px;color:var(--soft)}
.legend{display:grid;gap:2px;margin-top:10px}
.lg{display:grid;grid-template-columns:14px minmax(0,1fr) auto 52px;gap:10px;align-items:center;min-height:40px;border:0;background:none;font:inherit;color:inherit;text-align:left;padding:4px;border-bottom:1px solid var(--line);cursor:pointer;width:100%}
.lg .d{width:14px;height:14px;border-radius:4px}
.lg b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.lg em{font-style:normal;color:var(--soft);font-size:14px;text-align:right;font-variant-numeric:tabular-nums}
.lg small{color:#b23642;font-size:13px;margin-left:6px}
.warn{margin:8px 0 0;padding:8px 12px;border-radius:12px;background:var(--coralbg);color:#b23642;font-size:14px}
label.f{display:grid;gap:4px;font-size:13px;color:var(--soft)}
input[type=text],input[type=number],select{font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1.5px solid #e4dcef;border-radius:12px;height:44px;padding:0 12px;width:100%}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.erow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr) 44px;gap:8px;align-items:end;padding:10px 0;border-bottom:1px solid var(--line)}
.erow .wide{grid-column:1 / -2}
.erow .del{width:44px;height:44px;border:0;border-radius:12px;background:#f8eef0;color:#b23642;font:600 20px/1 Fredoka,sans-serif;cursor:pointer}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
textarea{width:100%;font:13px/1.4 ui-monospace,Menlo,monospace;color:var(--ink);border:1.5px solid #e4dcef;border-radius:12px;padding:10px;min-height:150px;resize:vertical}
.drop{position:relative;display:grid;place-items:center;text-align:center;gap:6px;border:2px dashed #d6cbe8;border-radius:18px;padding:22px 14px;background:#fbf8fe;color:var(--soft);cursor:pointer}
.drop.on{border-color:var(--lav);background:#f3eefc}
.msg{margin:10px 0 0;font-size:15px}
details.edit{margin-top:14px;border-top:1px solid var(--line);padding-top:8px}
details.edit summary{cursor:pointer;font-weight:600;min-height:40px;display:flex;align-items:center}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-size:18px;color:var(--soft);transition:opacity .5s}
@media(max-width:600px){
 .brand h1{font-size:26px}.brand p{display:none}
 .stats{gap:6px}.stat{padding:6px 9px;border-radius:13px}.stat b{font-size:16px}.stat span{font-size:12px}
 .months button{padding:0 13px}
 .hint{font-size:13px}
 .hist{height:96px;margin-top:12px}.big b{font-size:38px}.sheet h2{font-size:24px}
 .erow{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 44px}.erow .nm{grid-column:1 / -2}.erow .del{grid-row:1;grid-column:3}.erow .wide{grid-column:1 / -1}
}
@media(prefers-reduced-motion:reduce){.sheet{transition:none}}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="Isometric house with six rooms, a yard, a savings garden with a gardener, and a water tower. Every object can hold a bill; red rings mark bills that are over budget."></canvas>
<div id="loading">Building your house…</div>

<header class="hud">
 <div class="brand"><h1>Budget House</h1><p>Where the money lives this month</p></div>
 <nav class="months" id="months" aria-label="Month"></nav>
 <div class="stats" id="stats"></div>
</header>

<div class="bar">
 <span class="hint" id="hint"></span>
 <button class="btn" id="budgetBtn">Budget</button>
 <span class="tag-sample" id="sampleTag">Sample budget</span>
</div>

<aside class="sheet" id="sheet" aria-live="polite"></aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
{
if(!window.THREE){document.getElementById('loading').textContent='The 3D engine could not load. Check your connection and refresh.';throw new Error('no three')}

/* ---------- Sample data ---------- */
const MONTHS=['Sep','Oct','Nov'];
const CATS=['Housing','Food','Transportation','Utilities','Insurance','Subscriptions','Family','Home','Health','Pets','Wants','Giving','Other'];
const SAMPLE={
 income:[5300,5300,5300],
 bills:[
  {id:'mortgage',name:'Mortgage',cat:'Housing',budget:1320,a:[1320,1320,1320],due:'the 1st',note:'Escrow covers property taxes and homeowners insurance.',spot:'mailbox'},
  {id:'groceries',name:'Groceries',cat:'Food',budget:1000,a:[962,1048,1115],due:'weekly',note:'Thanksgiving week pushed November over.',spot:'fridge'},
  {id:'fuel',name:'Gas for the car',cat:'Transportation',budget:260,a:[241,276,228],due:'as needed',note:'Fewer weekend drives once the weather turned.',spot:'gascan'},
  {id:'autoins',name:'Car insurance',cat:'Transportation',budget:118,a:[118,118,118],due:'the 12th',note:'Worth comparing quotes once a year.',spot:'car'},
  {id:'electric',name:'Electricity',cat:'Utilities',budget:140,a:[96,118,162],due:'the 18th',note:'Shorter days mean more lights on.',spot:'lamp'},
  {id:'natgas',name:'Natural gas',cat:'Utilities',budget:80,a:[28,64,109],due:'the 20th',note:'The furnace kicked on in October.',spot:'stove'},
  {id:'water',name:'Water & sewer',cat:'Utilities',budget:95,a:[102,91,88],due:'the 25th',note:'Sprinklers are off for the season.',spot:'sink'},
  {id:'internet',name:'Internet',cat:'Utilities',budget:70,a:[70,70,70],due:'the 5th',note:'Same price as last year.',spot:'router'},
  {id:'phones',name:'Phone plan',cat:'Utilities',budget:90,a:[90,90,92],due:'the 9th',note:'A small fee increase started in November.',spot:'phone'},
  {id:'streaming',name:'Streaming',cat:'Subscriptions',budget:24,a:[24,24,31],due:'the 14th',note:'One service raised its price in November.',spot:'tv'},
  {id:'health',name:'Health insurance',cat:'Insurance',budget:640,a:[640,640,640],due:'the 1st',note:'Open enrollment is a good time to compare plans.',spot:'medcab'},
  {id:'kids',name:'Kids’ activities',cat:'Family',budget:85,a:[120,85,60],due:'varies',note:'Soccer registration landed in September.',spot:'toychest'},
  {id:'household',name:'Household goods',cat:'Home',budget:120,a:[134,108,126],due:'as needed',note:'Soap, paper towels, diapers and the rest.',spot:'basket'},
  {id:'fun',name:'Fun money',cat:'Wants',budget:200,a:[185,212,160],due:'monthly',note:'Books, dates and little treats.',spot:'bookshelf'}
 ],
 tank:{name:'Emergency fund',goal:10000,start:3800,target:400,a:[400,250,450]},
 goals:[
  {name:'Next car',goal:8000,start:2100,target:200,a:[200,100,200]},
  {name:'Camping trip',goal:1800,start:600,target:150,a:[150,150,200]},
  {name:'Holiday gifts',goal:600,start:300,target:100,a:[100,100,50]},
  {name:'Kids’ bikes',goal:400,start:80,target:40,a:[40,60,40]}
 ]};
const GOAL_LOOK=[
 {icon:'car',plant:'cabbage',color:'#a6cff2',ink:'#1d456c'},
 {icon:'tent',plant:'sunflower',color:'#b4e09f',ink:'#2d5a24'},
 {icon:'gift',plant:'pine',color:'#f7b3c8',ink:'#7b2346'},
 {icon:'bike',plant:'tulip',color:'#ffd978',ink:'#6e4210'}];
const KEY='budget-house-v3';
const clone=o=>JSON.parse(JSON.stringify(o));
let S=clone(SAMPLE),edited=false;
try{const raw=localStorage.getItem(KEY);if(raw){const v=JSON.parse(raw);if(v&&Array.isArray(v.bills)&&v.tank&&Array.isArray(v.goals)&&v.goals.length===4&&Array.isArray(v.income)){S=v;edited=true}}}catch(e){}
function save(){edited=true;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const SLOTS=8,FULL=6;
let month=2;
const num=v=>{const n=parseFloat(String(v).replace(/[$,\s]/g,''));return isFinite(n)?Math.max(0,n):0};
const fmt=n=>'$'+Math.round(n).toLocaleString('en-US');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const balance=(g,m)=>g.start+g.a.slice(0,m+1).reduce((s,v)=>s+v,0);
const seeds=(g,m)=>g.target>0?clamp(Math.round(g.a[m]/g.target*FULL),0,SLOTS):(g.a[m]>0?FULL:0);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const uid=()=>'b'+Math.random().toString(36).slice(2,8);

/* ---------- Renderer, camera, light ---------- */
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const cam=new THREE.OrthographicCamera(-1,1,1,-1,0.1,240);
const OFF=new THREE.Vector3(34,30,34);
const HOME=new THREE.Vector3(0,2.2,-0.5);
const focus=HOME.clone(),focusGoal=HOME.clone();
let zoom=1,zoomGoal=1,baseZoom=1,halfH=20;
scene.add(new THREE.HemisphereLight(0xfff4ef,0xb8a8e0,0.62));
const sun=new THREE.DirectionalLight(0xfff1e2,0.74);
sun.position.set(-16,34,24);sun.castShadow=true;sun.shadow.mapSize.set(4096,4096);
Object.assign(sun.shadow.camera,{left:-30,right:30,top:30,bottom:-30,near:1,far:110});
sun.shadow.bias=-0.0005;sun.shadow.normalBias=0.03;scene.add(sun);
const world=new THREE.Group();scene.add(world);

/* ---------- Geometry helpers ---------- */
const matCache={};
const M=(c,o)=>{const k=c+JSON.stringify(o||{});return matCache[k]||(matCache[k]=new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.82,metalness:0},o)))};
const B=(c,o)=>new THREE.MeshBasicMaterial(Object.assign({color:c},o));
function rr(w,h,r){const s=new THREE.Shape(),x=-w/2,y=-h/2;r=Math.max(0.0005,Math.min(r,w/2,h/2));
 s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);s.lineTo(x+w,y+h-r);s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
 s.lineTo(x+r,y+h);s.quadraticCurveTo(x,y+h,x,y+h-r);s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);return s}
const gc={};
function rgeo(w,h,d,r){const k=[w,h,d,r].join();if(gc[k])return gc[k];
 const b=Math.max(0.001,Math.min(r,w/2-0.002,h/2-0.002,d/2-0.002));
 const g=new THREE.ExtrudeGeometry(rr(Math.max(w-2*b,0.002),Math.max(d-2*b,0.002),b),{depth:Math.max(h-2*b,0.001),bevelEnabled:true,bevelThickness:b,bevelSize:b,bevelSegments:3,curveSegments:5});
 g.rotateX(-Math.PI/2);g.translate(0,-(h/2-b),0);return gc[k]=g}
const cyl=(a,b,h,s=18,open=false)=>{const k='c'+[a,b,h,s,open];return gc[k]||(gc[k]=new THREE.CylinderGeometry(a,b,h,s,1,open))};
const sph=r=>{const k='s'+r;return gc[k]||(gc[k]=new THREE.SphereGeometry(r,20,14))};
function shade(m,cast=true){m.castShadow=cast;m.receiveShadow=true;return m}
function box(p,w,h,d,c,x,y,z,r=0.08,o){const m=new THREE.Mesh(rgeo(w,h,d,r),typeof c==='string'?M(c,o):c);m.position.set(x,y+h/2,z);p.add(shade(m));return m}
function mesh(p,geo,c,x,y,z,o){const m=new THREE.Mesh(geo,typeof c==='string'?M(c,o):c);m.position.set(x,y,z);p.add(shade(m));return m}
function grp(p,x,y,z,ry=0){const g=new THREE.Group();g.position.set(x,y,z);g.rotation.y=ry;p.add(g);return g}
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'));const t=new THREE.CanvasTexture(c);t.anisotropy=4;return{c,t}}
function rrect(x,X,Y,W,H,R){x.beginPath();x.moveTo(X+R,Y);x.arcTo(X+W,Y,X+W,Y+H,R);x.arcTo(X+W,Y+H,X,Y+H,R);x.arcTo(X,Y+H,X,Y,R);x.arcTo(X,Y,X+W,Y,R);x.closePath()}
function floor(w,d,x,z,c1,c2,cell=0.8){const m=c2?new THREE.MeshStandardMaterial({roughness:.85,map:(()=>{const t=canvasTex(64,64,g=>{g.fillStyle=c1;g.fillRect(0,0,64,64);g.fillStyle=c2;g.fillRect(0,0,32,32);g.fillRect(32,32,32,32)}).t;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(w/cell/2,d/cell/2);return t})()}):M(c1);
 const p=new THREE.Mesh(new THREE.PlaneGeometry(w,d),m);p.rotation.x=-Math.PI/2;p.position.set(x,0.305,z);p.receiveShadow=true;world.add(p);return p}
function disc(p,r,c,x,y,z){const d=new THREE.Mesh(new THREE.CircleGeometry(r,40),M(c));d.rotation.x=-Math.PI/2;d.position.set(x,y,z);d.receiveShadow=true;p.add(d);return d}

/* ---------- Diorama base ---------- */
box(world,35,1.7,29.4,'#cdc2e8',0,-1.7,0.2,0.6);
box(world,16.8,0.25,11.1,'#c2e2aa',-8.95,0,8.85,0.05);
box(world,17.4,0.25,28.8,'#b6dca1',8.15,0,0.2,0.05);

 if(a==='saveBill'){const b=billById(t.dataset.id);b.name=v('e-name').value.trim()||b.name;b.budget=num(v('e-budget').value);b.a[month]=num(v('e-spent').value);b.cat=v('e-cat').value;assign(b,v('e-spot').value||null);save();applyMonth(false);
  if(b.spot){selected=SPOTS[b.spot];flyTo(selected)}else selected=null;view.keep=true;render()}
 if(a==='delBill'){S.bills=S.bills.filter(b=>b.id!==t.dataset.id);save();applyMonth(false);close()}
 if(a==='addHere'){const nm=v('n-name').value.trim();if(!nm){v('n-name').focus();return}const amt=num(v('n-budget').value),sp=v('n-spent').value===''?amt:num(v('n-spent').value);
  const b={id:uid(),name:nm.slice(0,60),cat:v('n-cat').value,budget:amt,a:[sp,sp,sp],due:'',note:'',spot:null};S.bills.push(b);assign(b,t.dataset.spot);save();applyMonth(false);open({t:'bill',id:b.id})}
 if(a==='moveHere'){const b=billById(v('m-bill').value);if(b){assign(b,t.dataset.spot);save();applyMonth(false);open({t:'bill',id:b.id})}}
 if(a==='addRow'){S.bills.push({id:uid(),name:'New bill',cat:'Other',budget:0,a:[0,0,0],due:'',note:'',spot:null});save();applyMonth(false);view.keep=true;render();const ins=sheet.querySelectorAll('[data-ed=name]');const last=ins[ins.length-1];if(last){last.focus();last.select()}}
 if(a==='delRow'){S.bills.splice(+t.dataset.i,1);save();applyMonth(false);view.keep=true;render()}
 if(a==='reset'){S=clone(SAMPLE);edited=false;try{localStorage.removeItem(KEY)}catch(err){}applyMonth(false);view.keep=true;render()}
 if(a==='copyCsv'){const txt=toCSV(),ta=v('tpl');const done=()=>{t.textContent='Copied';setTimeout(()=>t.textContent='Copy current budget as CSV',1600)};
  const fallback=()=>{ta.focus();ta.select();t.textContent='Selected · copy it from the box'};
  try{navigator.clipboard.writeText(txt).then(done,fallback)}catch(err){fallback()}}});
sheet.addEventListener('change',e=>{const el=e.target,ed=el.dataset.ed;if(!ed)return;const i=+el.dataset.i,g=+el.dataset.g,G=g===0?S.tank:S.goals[g-1];
 if(ed==='income'){const val=num(el.value);if(sheet.querySelector('[data-ed=incomeAll]').value==='all')S.income=S.income.map(()=>val);else S.income[month]=val}
 if(ed==='incomeAll'&&el.value==='all'){const val=num(sheet.querySelector('[data-ed=income]').value);S.income=S.income.map(()=>val)}
 if(ed==='name')S.bills[i].name=el.value.trim().slice(0,60)||S.bills[i].name;
 if(ed==='budget')S.bills[i].budget=num(el.value);
 if(ed==='spent')S.bills[i].a[month]=num(el.value);
 if(ed==='spot'){assign(S.bills[i],el.value||null);save();applyMonth(false);view.keep=true;return render()}
 if(ed==='gname')G.name=el.value.trim().slice(0,40)||G.name;
 if(ed==='gtarget')G.target=num(el.value);
 if(ed==='gsaved')G.a[month]=num(el.value);
 if(ed==='ggoal')G.goal=num(el.value);
 save();applyMonth(false)});
document.getElementById('budgetBtn').addEventListener('click',()=>{selected=null;flyTo(null);budgetTab='overview';open({t:'budget'})});
addEventListener('keydown',e=>{if(e.target.matches&&e.target.matches('input,select,textarea'))return;if(e.key==='Escape')close();if(e.key==='ArrowLeft'&&month>0){month--;applyMonth()}if(e.key==='ArrowRight'&&month<2){month++;applyMonth()}});

/* ---------- Import / export ---------- */
function toCSV(){const q=s=>/[",\n]/.test(s)?`"${String(s).replace(/"/g,'""')}"`:s;
 return ['name,category,budget,spent',`Take-home pay,Income,${S.income[month]},`,...S.bills.map(b=>[q(b.name),q(b.cat),b.budget,b.a[month]].join(',')),
  [q(S.tank.name),'Savings',S.tank.target,S.tank.a[month]].join(','),...S.goals.map(g=>[q(g.name),'Savings',g.target,g.a[month]].join(','))].join('\n')}
function parseCSV(text){const rows=[];let row=[],f='',q=false;for(let i=0;i<text.length;i++){const c=text[i];
 if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
 else if(c==='"')q=true;else if(c===','||c==='\t'){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}
 if(f!==''||row.length){row.push(f);rows.push(row)}return rows.map(r=>r.map(s=>s.trim())).filter(r=>r.some(Boolean))}
const KEYWORDS=[[/mortgage|rent|hoa|property tax/i,'mailbox'],[/grocer|supermarket/i,'fridge'],[/fuel|gas for|gasoline|petrol/i,'gascan'],[/car|auto|vehicle/i,'car'],
 [/electric|power/i,'lamp'],[/natural gas|heat|propane|furnace/i,'stove'],[/water|sewer|trash|garbage/i,'sink'],[/internet|wi-?fi|broadband/i,'router'],[/phone|cell|mobile/i,'phone'],
 [/stream|netflix|hulu|disney|spotify|subscription|\btv\b/i,'tv'],[/health|medical|doctor|dental|insurance/i,'medcab'],[/childcare|daycare|baby|diaper/i,'crib'],[/kid|child|school|activit|sport/i,'toychest'],
 [/household|cleaning|laundry/i,'basket'],[/fun|entertain|book|hobby|wants/i,'bookshelf'],[/pet|dog|cat|vet/i,'doghouse'],[/eat|restaurant|dining|takeout/i,'grill'],
 [/coffee|cafe/i,'coffee'],[/gym|fitness|yoga/i,'yoga'],[/bike|cycl/i,'bike'],[/repair|maintenance|tools|home improvement/i,'shed'],[/furniture|decor/i,'sofa'],[/clothes|clothing/i,'washer'],
 [/gift|giving|charity|church|tithe|donat/i,'table'],[/plant|garden/i,'plant'],[/bath|personal care|toiletr|hair/i,'vanity'],[/food/i,'fridge']];
function autoPlace(list,taken=new Set()){
 for(const b of list){b.spot=null;for(const [re,sid] of KEYWORDS){if(re.test(b.name+' '+b.cat)&&!taken.has(sid)){b.spot=sid;taken.add(sid);break}}}
 const free=Object.keys(SPOTS).filter(s=>!taken.has(s));for(const b of list)if(!b.spot&&free.length)b.spot=free.shift()}
function readFile(file){const r=new FileReader();r.onload=()=>{try{importText(String(r.result),file.name)}catch(err){uploadMsg='That file couldn’t be read. Check that it’s a CSV or JSON file with a name and an amount on each row.';render()}};r.readAsText(file)}
function sanG(g){return{name:String(g.name||'Goal').slice(0,40),goal:num(g.goal),start:num(g.start),target:num(g.target),a:Array.isArray(g.a)&&g.a.length===3?g.a.map(num):[0,0,0]}}
function importText(text,name){let n=0,extra='';
 if(/\.json$/i.test(name)||/^\s*[\[{]/.test(text)){const d=JSON.parse(text);const arr=Array.isArray(d)?d:d.bills;if(!Array.isArray(arr))throw 0;
  const bills=arr.map(x=>({id:uid(),name:String(x.name||'Bill').slice(0,60),cat:CATS.includes(x.cat||x.category)?(x.cat||x.category):'Other',budget:num(x.budget),
   a:Array.isArray(x.a)&&x.a.length===3?x.a.map(num):[0,0,0].map(()=>num(x.spent!=null?x.spent:x.budget)),due:String(x.due||'').slice(0,30),note:String(x.note||'').slice(0,200),spot:SPOTS[x.spot]?x.spot:null}));
  if(!Array.isArray(d)){if(Array.isArray(d.income)&&d.income.length===3)S.income=d.income.map(num);if(d.tank)Object.assign(S.tank,sanG(d.tank));if(Array.isArray(d.goals))d.goals.slice(0,4).forEach((g,i)=>Object.assign(S.goals[i],sanG(g)))}
  const taken=new Set(bills.filter(b=>b.spot).map(b=>b.spot));autoPlace(bills.filter(b=>!b.spot),taken);S.bills=bills;n=bills.length}
 else{const rows=parseCSV(text);if(!rows.length)throw 0;const h=rows[0].map(s=>s.toLowerCase());const hasHead=h.some(s=>/name|item|category|budget|amount|spent|actual/.test(s));
  const col=(re,d)=>hasHead?h.findIndex(s=>re.test(s)):d;
  const ci={name:col(/name|item|bill|expense|description|payee/,0),cat:col(/categ|group|type/,-1),budget:col(/budget|planned|amount|limit/,1),spent:col(/spent|actual|paid/,2)};if(ci.name<0)ci.name=0;
  const bills=[];let gi=0;for(const r of rows.slice(hasHead?1:0)){const nm=(r[ci.name]||'').slice(0,60);if(!nm)continue;const cat=ci.cat>=0?(r[ci.cat]||''):'';const bud=ci.budget>=0?num(r[ci.budget]):0;
   const sp=ci.spent>=0&&r[ci.spent]!==undefined&&r[ci.spent]!==''?num(r[ci.spent]):bud;
   if(/income|take.?home|paycheck|salary|wages/i.test(nm+' '+cat)){S.income=S.income.map(()=>bud||sp);extra+=` Take-home pay set to ${fmt(bud||sp)}.`;continue}
   if(/saving/i.test(cat)){if(/emergency|rainy|safety/i.test(nm)){S.tank.name=nm;S.tank.target=bud;S.tank.a=[sp,sp,sp]}else if(gi<4){const g=S.goals[gi++];g.name=nm;g.target=bud;g.a=[sp,sp,sp]}continue}
   const c=CATS.find(x=>x.toLowerCase()===cat.toLowerCase())||'Other';bills.push({id:uid(),name:nm,cat:c,budget:bud,a:[sp,sp,sp],due:'',note:'',spot:null})}
  if(!bills.length)throw 0;autoPlace(bills);S.bills=bills;n=bills.length;extra+=' All three months start with the same amounts; switch months to edit Sep and Oct.'}
 save();applyMonth(false);const unplaced=S.bills.filter(b=>!b.spot).length;
 uploadMsg=`Loaded <b>${n} bill${n===1?'':'s'}</b>${unplaced?`; ${unplaced} didn’t fit in the house and show only in the budget`:'; every one has a spot in the house'}.${esc(extra)}`;budgetTab='upload';render()}

/* ---------- Camera moves ---------- */
const tmp=new THREE.Vector3();
function flyTo(h){if(!h){focusGoal.copy(HOME);zoomGoal=baseZoom;return}
 world.localToWorld(tmp.copy(h.ctr));const z=Math.max(zoomGoal,baseZoom*(h.kind==='tank'?1.5:1.9));zoomGoal=z;
 const up=new THREE.Vector3(0,1,0).applyQuaternion(cam.quaternion),right=new THREE.Vector3(1,0,0).applyQuaternion(cam.quaternion);
 const wide=innerWidth>=900,ext=halfH/z;focusGoal.copy(tmp);
 if(wide){const sl=sheet.classList.contains('open')?sheet.getBoundingClientRect().left:innerWidth;const tx=sl/2;focusGoal.addScaledVector(right,(innerWidth/2-tx)/(innerWidth/2)*ext*(innerWidth/innerHeight))}
 else{const hb=document.querySelector('.hud').getBoundingClientRect().bottom,st=sheet.classList.contains('open')?innerHeight-sheet.offsetHeight-12:innerHeight,ty=(hb+st)/2;focusGoal.addScaledVector(up,-(innerHeight/2-ty)/(innerHeight/2)*ext)}}

/* ---------- Input ---------- */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),ptrs=new Map();
let downX=0,downY=0,moved=false,rotY=0,pinch0=0,zoom0=1,hoverQ=null,hovered=null;
function hit(e){const r=canvas.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(ndc,cam);
 for(const x of ray.intersectObjects(targets,false)){const o=x.object;if(o.isSprite&&!o.visible)continue;if(o.userData.hot)return o.userData.hot}return null}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptrs.size===1){downX=e.clientX;downY=e.clientY;moved=false}else{const [a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y)||1;zoom0=zoomGoal;moved=true}});
canvas.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);
 if(!p){if(e.pointerType==='mouse'&&!hoverQ){hoverQ=e;requestAnimationFrame(()=>{hovered=hit(hoverQ);canvas.style.cursor=hovered?'pointer':'grab';hoverQ=null})}return}
 const dx=e.clientX-p.x;p.x=e.clientX;p.y=e.clientY;
 if(ptrs.size>=2){const [a,b]=[...ptrs.values()];zoomGoal=clamp(zoom0*Math.hypot(a.x-b.x,a.y-b.y)/pinch0,baseZoom*0.8,baseZoom*3.4);return}
 if(Math.hypot(e.clientX-downX,e.clientY-downY)>7)moved=true;
 if(moved){rotY=clamp(rotY+dx*0.006,-0.8,0.8);world.rotation.y=rotY;canvas.style.cursor='grabbing'}});
canvas.addEventListener('pointerleave',()=>{hovered=null});
function up(e){const had=ptrs.delete(e.pointerId);if(had&&!moved&&ptrs.size===0&&e.type==='pointerup'){const h=hit(e);if(h)select(h.id);else if(view)close()}if(!ptrs.size)canvas.style.cursor='grab'}
canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
canvas.addEventListener('wheel',e=>{e.preventDefault();zoomGoal=clamp(zoomGoal*Math.exp(-e.deltaY*0.0015),baseZoom*0.8,baseZoom*3.4)},{passive:false});

/* ---------- Resize & loop ---------- */
function resize(){const w=innerWidth,h=innerHeight,a=w/h;renderer.setSize(w,h,false);
 halfH=Math.max(19.5,25.5/a);const tp=halfH*(a<1?1.04:1.12),bt=halfH*(a<1?0.96:0.88);
 cam.left=-halfH*a;cam.right=halfH*a;cam.top=tp;cam.bottom=-bt;
 const nb=a<0.8?1.28:1;if(nb!==baseZoom){zoomGoal*=nb/baseZoom;zoom*=nb/baseZoom;baseZoom=nb}cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();zoom=zoomGoal=baseZoom;

function tickGardener(dt,t){const G=gardener,g=G.g;
 if(G.state==='walk'&&G.path.length){const tgt=G.path[0],dx=tgt.x-g.position.x,dz=tgt.z-g.position.z,d=Math.hypot(dx,dz);
  if(d<0.05){G.path.shift();if(!G.path.length){G.state=G.row>=0?'water':'idle';G.timer=2.5+rnd()*2}}
  else{const st=Math.min(d,1.7*dt);g.position.x+=dx/d*st;g.position.z+=dz/d*st;G.face=Math.atan2(dx,dz)}
  const sw=reduce?0:Math.sin(t*9)*0.55;G.legL.rotation.x=sw;G.legR.rotation.x=-sw;G.armL.rotation.x=-sw*0.8;G.armR.rotation.x=sw*0.3-0.4;G.can.rotation.x=0;g.position.y=0.25+(reduce?0:Math.abs(Math.sin(t*9))*0.05)}
 else{G.legL.rotation.x=G.legR.rotation.x=0;g.position.y=0.25;
  if(G.state==='water'){G.face=Math.PI/2;G.armR.rotation.x=-1.1;G.armL.rotation.x=-0.2;G.can.rotation.x=0.9+(reduce?0:Math.sin(t*3)*0.08);
   G.tip.getWorldPosition(tipW);world.worldToLocal(tipW);
   if(!reduce&&Math.random()<dt*14){const d=drops.find(x=>x.life<=0);if(d){d.m.position.copy(tipW);d.v.set(0.6+Math.random()*0.3,0.3,(Math.random()-0.5)*0.3);d.life=1;d.m.visible=true}}
   G.timer-=dt;if(G.timer<=0){G.path=[new THREE.Vector3(g.position.x,0,pickSlotZ(G.row))];G.state='walk'}}
  else{G.face=Math.PI/4;G.armR.rotation.x=-0.3;G.armL.rotation.x=0;G.can.rotation.x=0}}
 let df=G.face-g.rotation.y;df=Math.atan2(Math.sin(df),Math.cos(df));g.rotation.y+=df*(1-Math.exp(-dt*8));
 for(const d of drops){if(d.life<=0)continue;d.life-=dt*1.6;d.v.y-=9*dt;d.m.position.addScaledVector(d.v,dt);if(d.life<=0||d.m.position.y<0.45){d.life=0;d.m.visible=false}}}
const clock=new THREE.Clock();let first=true;
function tick(){const dt=Math.min(clock.getDelta(),0.05),t=clock.elapsedTime,k=1-Math.exp(-dt*5);
 focus.lerp(focusGoal,k);zoom+=(zoomGoal-zoom)*k;cam.position.copy(focus).add(OFF);cam.lookAt(focus);cam.zoom=zoom;cam.updateProjectionMatrix();
 for(const h of hot){const sel=selected===h,hov=hovered===h;
  if(h.kind==='goal'){h.g.rotation.z=reduce?0:Math.sin(t*1.3+h.phase)*0.05;const gs=sel?1.2:1;h.g.scale.setScalar(h.g.scale.x+(gs-h.g.scale.x)*k);continue}
  if(h.kind==='tank')continue;
  h.g.scale.setScalar(h.base*(sel?1.04:1));
  for(const m of h.mats){m.emissiveIntensity=sel?0.28:hov?0.14:0;if(sel||hov)m.emissive.set('#b9a7ea')}
  if(h.ring){if(h.status==='over'){const s=reduce?0.6:(Math.sin(t*4.5+h.phase)+1)/2;h.ring.visible=true;h.ring.material.color.set('#f0707a');h.ring.material.opacity=sel?0.95:0.3+0.55*s;h.ring.scale.setScalar(1+0.12*s)}
   else{h.ring.visible=sel;h.ring.material.color.set('#b9a7ea');h.ring.material.opacity=0.85;h.ring.scale.setScalar(1)}}
  if(h.badge.visible){h.badge.position.y=h.badge.userData.y;h.badge.scale.setScalar(h.status==='over'?0.9:sel?0.85:0.62)}}
 const lv=S.tank.goal?clamp(balance(S.tank,month)/S.tank.goal,0,1):0;tankLevel+=(lv-tankLevel)*(1-Math.exp(-dt*2.5));gauge.scale.y=Math.max(0.01,2.8*tankLevel);gauge.position.y=-1.4+1.4*tankLevel;
 for(const s of slots){if(s.delay>0){s.delay-=dt;continue}s.cur+=(s.target-s.cur)*(1-Math.exp(-dt*(s.target?6:9)));
  const v=s.target?Math.min(1,s.cur*1.08+Math.sin(s.cur*Math.PI)*0.12):s.cur;s.g.scale.setScalar(Math.max(0.001,v));s.g.visible=v>0.01;s.g.rotation.z=reduce?0:Math.sin(t*1.6+s.phase)*0.05}
 tickGardener(dt,t);
 routerLed.material.color.set(Math.sin(t*6)>0?'#6be3a8':'#2f9e6c');
 for(const f of flies){const a=reduce?f.ph:t*0.5+f.ph;f.g.position.set(f.x+Math.cos(a)*1.6,2.6+Math.sin(t*1.7+f.ph)*0.4,f.z+Math.sin(a*1.3)*1.4);f.g.rotation.y=-a;const fl=reduce?0.4:Math.sin(t*14+f.ph)*0.9;f.p1.rotation.z=fl;f.p2.rotation.z=-fl}
 renderer.render(scene,cam);
 if(first){first=false;const l=document.getElementById('loading');l.style.opacity=0;setTimeout(()=>l.remove(),600)}
 requestAnimationFrame(tick)}
applyMonth();
for(const s of slots){s.cur=s.target;s.delay=0}
tankLevel=S.tank.goal?clamp(balance(S.tank,month)/S.tank.goal,0,1):0;
{const r=activeRow();gardener.row=r;if(r>=0){gardener.g.position.set(ROWX[r]-1.55,0.25,pickSlotZ(r));gardener.path=[];gardener.state='water';gardener.timer=2}}
if(document.fonts)document.fonts.ready.then(()=>{for(const k in COINS){coinDraw(coin[k].c.getContext('2d'),...COINS[k]);coin[k].t.needsUpdate=true}S.goals.forEach((g,i)=>packetDraw(i,month));plaqueDraw(month)});

tick();
}
