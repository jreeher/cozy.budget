<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Budget House</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: cozy and playful, like a dollhouse you can poke at
   IDEA: an isometric diorama where every bill is a thing in the house, and savings grow in the garden
   PICTURE: full-screen 2.5D cutaway house and garden in soft pastel light
   COLOUR and TYPE: blush, lavender, mint and butter; Fredoka rounded
   LAYOUT: the scene fills the screen; HUD floats on top; details open in a sheet */
:root{color-scheme:light;--ink:#3b3350;--soft:#6c6386;--card:#fffaf7;--mint:#3fb68d;--mintbg:#dcf5ea;--coral:#e8606c;--coralbg:#fde1e3;--lav:#b9a7ea;--butter:#ffd76e}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden}
body{font:16px/1.45 Fredoka,ui-rounded,"Segoe UI",system-ui,sans-serif;color:var(--ink);background:linear-gradient(165deg,#e7e0fb 0%,#f8dde7 55%,#fde8da 100%)}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block;outline:none}
.hud{position:fixed;left:0;right:0;top:0;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;pointer-events:none}
.hud>*{pointer-events:auto}
.brand h1{margin:0;font-size:32px;line-height:1.05;font-weight:700;text-shadow:0 0 14px #fff,0 0 4px #fff}
.brand p{margin:3px 0 0;color:var(--soft);font-size:14px}
.months{display:flex;background:#ffffffb3;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:4px;box-shadow:0 6px 20px #7a5fb022}
.months button{font:inherit;font-weight:600;border:0;background:none;color:var(--soft);padding:0 18px;height:40px;border-radius:999px;cursor:pointer}
.months button[aria-pressed=true]{background:var(--ink);color:#fff}
.months button:focus-visible,.btn:focus-visible,.x:focus-visible,.row:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
.stats{flex-basis:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-width:620px}
.stat{background:#ffffffb8;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:16px;padding:7px 12px;box-shadow:0 6px 20px #7a5fb01a}
.stat span{display:block;font-size:13px;color:var(--soft)}
.stat b{font-size:20px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.stat.saved b{color:var(--mint)}
.bar{position:fixed;left:max(16px,env(safe-area-inset-left));right:16px;bottom:max(16px,env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:8px;align-items:center;pointer-events:none;transition:opacity .25s}
.bar>*{pointer-events:auto}
.hint{background:#ffffffc4;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:9px 14px;font-size:14px;color:var(--soft);box-shadow:0 6px 20px #7a5fb01a}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;margin:0 3px 0 8px}
.btn{font:inherit;font-weight:600;border:0;border-radius:999px;height:44px;padding:0 18px;background:var(--ink);color:#fff;cursor:pointer;box-shadow:0 6px 20px #3b335033}
.tag-sample{font-size:13px;color:var(--soft);background:#ffffff8c;border-radius:999px;padding:4px 10px}
.sheet{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));width:min(440px,calc(100% - 24px));max-height:60vh;overflow:auto;transform:translate(-50%,calc(100% + 60px));transition:transform .38s cubic-bezier(.2,.9,.3,1.15);background:var(--card);border-radius:26px;box-shadow:0 20px 60px #5a3f8a3d;padding:16px 20px 20px;overscroll-behavior:contain}
.sheet.open{transform:translate(-50%,0)}
body.sheet-open .bar{opacity:0;pointer-events:none}
body.sheet-open .bar>*{pointer-events:none}
@media(min-width:900px){
 .sheet{left:auto;right:20px;top:50%;bottom:auto;max-height:calc(100vh - 40px);transform:translate(calc(100% + 60px),-50%)}
 .sheet.open{transform:translate(0,-50%)}
 body.sheet-open .bar{opacity:1}
 body.sheet-open .bar>*{pointer-events:auto}
}
.sh-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:#efe9fb;color:#5b4a8f}
.x{width:44px;height:44px;border:0;border-radius:50%;background:#f2edf8;color:var(--ink);font:600 22px/1 Fredoka,sans-serif;cursor:pointer;flex:none}
.sheet h2{margin:6px 0 0;font-size:28px;line-height:1.1;font-weight:700}
.where{margin:2px 0 12px;color:var(--soft);font-size:15px}
.big{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.big b{font-size:44px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.pill{font-size:14px;font-weight:600;border-radius:999px;padding:4px 10px;white-space:nowrap}
.pill.ok{background:var(--mintbg);color:#1f7d5c}.pill.over{background:var(--coralbg);color:#b23642}
.meter{height:12px;border-radius:99px;background:#efe9f5;margin:14px 0 4px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--mint)}
.meter.over i{background:var(--coral)}
.sub{margin:0;color:var(--soft);font-size:14px}
.hist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end;height:116px;margin:16px 0 4px}
.hist div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px;font-size:13px;color:var(--soft)}
.hist em{font-style:normal;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.hist i{display:block;width:100%;max-width:64px;border-radius:10px 10px 4px 4px;background:#e4dbf6}
.hist .cur i{background:var(--lav)}
.hist .cur{color:var(--ink);font-weight:600}
.note{margin:12px 0 0;padding:10px 12px;background:#fbf3ee;border-radius:14px;font-size:15px}
.list h3{margin:14px 0 6px;font-size:15px;color:var(--soft);font-weight:600}
.row{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;min-height:48px;border:0;background:none;font:inherit;color:inherit;text-align:left;padding:6px 4px;border-bottom:1px solid #f0e9f2;cursor:pointer}
.row span:nth-child(2) small{display:block;color:var(--soft);font-size:13px}
.row b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .d{width:12px;height:12px;border-radius:50%}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-size:18px;color:var(--soft);transition:opacity .5s}
@media(max-width:600px){
 .brand h1{font-size:26px}.brand p{display:none}
 .stats{gap:6px}.stat{padding:6px 9px;border-radius:13px}.stat b{font-size:16px}.stat span{font-size:12px}
 .months button{padding:0 13px}
 .hint{font-size:13px}
 .hist{height:96px;margin-top:12px}.big b{font-size:38px}.sheet h2{font-size:24px}
}
@media(prefers-reduced-motion:reduce){.sheet{transition:none}}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="Isometric house and garden. Each glowing item is a monthly bill; each garden row is a savings goal."></canvas>
<div id="loading">Building your house…</div>

<header class="hud">
 <div class="brand"><h1>Budget House</h1><p>Where the money lives this month</p></div>
 <nav class="months" id="months" aria-label="Month"></nav>
 <div class="stats" id="stats"></div>
</header>

<div class="bar">
 <span class="hint">Tap anything glowing<span class="dot" style="background:#5fc9a4"></span>on budget<span class="dot" style="background:#f0707a"></span>over</span>
 <button class="btn" id="allBtn">All bills</button>
 <span class="tag-sample">Sample budget</span>
</div>

<aside class="sheet" id="sheet" aria-live="polite"></aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
{
if(!window.THREE){document.getElementById('loading').textContent='The 3D engine could not load. Check your connection and refresh.';throw new Error('no three')}

/* ---------- Sample data ---------- */
const MONTHS=['Sep','Oct','Nov'];
const INCOME=[5300,5300,5300];
const BILLS=[
 {id:'mortgage',name:'Mortgage',where:'The mailbox',cat:'Housing',budget:1320,a:[1320,1320,1320],due:'the 1st',note:'Escrow covers property taxes and homeowners insurance.'},
 {id:'groceries',name:'Groceries',where:'The fridge',cat:'Food',budget:1000,a:[962,1048,1115],due:'weekly',note:'Thanksgiving week pushed November over.'},
 {id:'fuel',name:'Gas for the car',where:'The gas can',cat:'Transportation',budget:260,a:[241,276,228],due:'as needed',note:'Fewer weekend drives once the weather turned.'},
 {id:'autoins',name:'Car insurance',where:'The car',cat:'Transportation',budget:118,a:[118,118,118],due:'the 12th',note:'Worth comparing quotes once a year.'},
 {id:'electric',name:'Electricity',where:'The floor lamp',cat:'Utilities',budget:140,a:[96,118,162],due:'the 18th',note:'Shorter days mean more lights on.'},
 {id:'natgas',name:'Natural gas',where:'The stove',cat:'Utilities',budget:80,a:[28,64,109],due:'the 20th',note:'The furnace kicked on in October.'},
 {id:'water',name:'Water & sewer',where:'The kitchen sink',cat:'Utilities',budget:95,a:[102,91,88],due:'the 25th',note:'Sprinklers are off for the season.'},
 {id:'internet',name:'Internet',where:'The Wi-Fi router',cat:'Utilities',budget:70,a:[70,70,70],due:'the 5th',note:'Same price as last year.'},

 {id:'streaming',name:'Streaming',where:'The TV',cat:'Subscriptions',budget:24,a:[24,24,31],due:'the 14th',note:'One service raised its price in November.'},
 {id:'health',name:'Health insurance',where:'The first-aid cabinet',cat:'Insurance',budget:640,a:[640,640,640],due:'the 1st',note:'Open enrollment is a good time to compare plans.'},
 {id:'kids',name:'Kids’ activities',where:'The toy chest',cat:'Family',budget:85,a:[120,85,60],due:'varies',note:'Soccer registration landed in September.'},
 {id:'household',name:'Household goods',where:'The laundry basket',cat:'Home',budget:120,a:[134,108,126],due:'as needed',note:'Soap, paper towels, diapers and the rest.'},
 {id:'fun',name:'Fun money',where:'The bookshelf',cat:'Wants',budget:200,a:[185,212,160],due:'monthly',note:'Books, dates and little treats.'}
];
const GOALS=[
 {id:'g-emergency',name:'Emergency fund',plant:'sunflower',color:'#ffd35c',ink:'#6e4210',goal:10000,start:3800,target:400,a:[400,250,450]},
 {id:'g-camping',name:'Camping trip',plant:'tulip',color:'#f7a6bf',ink:'#7b2346',goal:1800,start:600,target:150,a:[150,150,200]},
 {id:'g-car',name:'Next car',plant:'cabbage',color:'#a9dd94',ink:'#2d5a24',goal:8000,start:2100,target:200,a:[200,100,200]},
 {id:'g-gifts',name:'Holiday gifts',plant:'pine',color:'#a6cff2',ink:'#1d456c',goal:600,start:300,target:100,a:[100,100,50]}
];
const SLOTS=8,FULL=6; // meeting the monthly target plants 6 seeds; saving extra fills up to 8
let month=2;
const fmt=n=>'$'+Math.round(n).toLocaleString('en-US');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const balance=(g,m)=>g.start+g.a.slice(0,m+1).reduce((s,v)=>s+v,0);
const seeds=(g,m)=>clamp(Math.round(g.a[m]/g.target*FULL),0,SLOTS);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Renderer, camera, light ---------- */
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const cam=new THREE.OrthographicCamera(-1,1,1,-1,0.1,200);
const OFF=new THREE.Vector3(30,26,30);
const HOME=new THREE.Vector3(0.6,1.2,0.2);
const focus=HOME.clone(),focusGoal=HOME.clone();
let zoom=1,zoomGoal=1,baseZoom=1,halfH=16;

scene.add(new THREE.HemisphereLight(0xfff4ef,0xb8a8e0,0.62));
const sun=new THREE.DirectionalLight(0xfff1e2,0.74);
sun.position.set(-14,30,22);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-24,right:24,top:24,bottom:-24,near:1,far:90});
sun.shadow.bias=-0.0005;sun.shadow.normalBias=0.03;scene.add(sun);

const world=new THREE.Group();scene.add(world);

/* ---------- Geometry helpers ---------- */
const matCache={};
const M=(c,o)=>{const k=c+JSON.stringify(o||{});return matCache[k]||(matCache[k]=new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.82,metalness:0},o)))};
const B=(c,o)=>new THREE.MeshBasicMaterial(Object.assign({color:c},o));
function rr(w,h,r){const s=new THREE.Shape(),x=-w/2,y=-h/2;r=Math.max(0.0005,Math.min(r,w/2,h/2));
 s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);s.lineTo(x+w,y+h-r);s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
 s.lineTo(x+r,y+h);s.quadraticCurveTo(x,y+h,x,y+h-r);s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);return s}
const gc={};
function rgeo(w,h,d,r){const k=[w,h,d,r].join();if(gc[k])return gc[k];
 const b=Math.max(0.001,Math.min(r,w/2-0.002,h/2-0.002,d/2-0.002));
 const g=new THREE.ExtrudeGeometry(rr(Math.max(w-2*b,0.002),Math.max(d-2*b,0.002),b),{depth:Math.max(h-2*b,0.001),bevelEnabled:true,bevelThickness:b,bevelSize:b,bevelSegments:3,curveSegments:5});
 g.rotateX(-Math.PI/2);g.translate(0,-(h/2-b),0);return gc[k]=g}
const cyl=(a,b,h,s=18,open=false)=>{const k='c'+[a,b,h,s,open];return gc[k]||(gc[k]=new THREE.CylinderGeometry(a,b,h,s,1,open))};
const sph=r=>{const k='s'+r;return gc[k]||(gc[k]=new THREE.SphereGeometry(r,20,14))};
function shade(m,cast=true){m.castShadow=cast;m.receiveShadow=true;return m}
function box(p,w,h,d,c,x,y,z,r=0.08,o){const m=new THREE.Mesh(rgeo(w,h,d,r),typeof c==='string'?M(c,o):c);m.position.set(x,y+h/2,z);p.add(shade(m));return m}
function mesh(p,geo,c,x,y,z,o){const m=new THREE.Mesh(geo,typeof c==='string'?M(c,o):c);m.position.set(x,y,z);p.add(shade(m));return m}
function grp(p,x,y,z,ry=0){const g=new THREE.Group();g.position.set(x,y,z);g.rotation.y=ry;p.add(g);return g}
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'));const t=new THREE.CanvasTexture(c);t.anisotropy=4;return{c,t}}
function rrect(x,X,Y,W,H,R){x.beginPath();x.moveTo(X+R,Y);x.arcTo(X+W,Y,X+W,Y+H,R);x.arcTo(X+W,Y+H,X,Y+H,R);x.arcTo(X,Y+H,X,Y,R);x.arcTo(X,Y,X+W,Y,R);x.closePath()}

/* ---------- Diorama base ---------- */
box(world,29,1.7,23,'#cdc2e8',0,-1.7,0,0.55);
box(world,13,0.3,13.4,'#ebbd95',-7.3,0,-4.1,0.05);
for(let i=1;i<10;i++)box(world,0.05,0.02,13.2,'#dca880',-13.8+i*1.3,0.3,-4.1,0.01);
box(world,13.4,0.25,8.6,'#c2e2aa',-7.5,0,6.9,0.05);
box(world,15.1,0.25,22.4,'#b6dca1',6.75,0,0,0.05);

/* Walls, LED strip, window, string lights */
box(world,13.6,6.6,0.45,'#f8dad5',-7.4,0,-10.75,0.1);
box(world,0.45,6.6,13.8,'#f3cfd8',-13.98,0,-4.1,0.1);
box(world,13.2,0.25,0.1,'#ffffff',-7.4,0.3,-10.5,0.03);
box(world,0.1,0.25,13.2,'#ffffff',-13.73,0.3,-4.1,0.03);
const led=B('#d4f0ff');
box(world,13.6,0.16,0.22,led,-7.4,6.6,-10.62,0.05);
box(world,0.22,0.16,13.8,led,-13.86,6.6,-4.1,0.05);
box(world,3.4,3.0,0.18,'#ffffff',-5.2,2.3,-10.46,0.1);
box(world,3.0,2.6,0.08,B('#d6efff'),-5.2,2.5,-10.38,0.02);
box(world,0.1,2.6,0.12,'#ffffff',-5.2,2.5,-10.33,0.02);
box(world,3.0,0.1,0.12,'#ffffff',-5.2,3.75,-10.33,0.02);
box(world,4.6,0.1,0.1,'#fffaf3',-5.2,5.45,-10.3,0.04);
box(world,0.9,3.5,0.26,'#d8c6f4',-7.35,1.95,-10.24,0.13);
box(world,0.9,3.5,0.26,'#d8c6f4',-3.05,1.95,-10.24,0.13);
const bulbA=B('#fff2b3'),bulbB=B('#ffc7d8');
for(let i=0;i<22;i++){const f=i/21;mesh(world,sph(0.1),i%2?bulbA:bulbB,-13.4+f*12.6,5.95-0.38*Math.abs(Math.sin(f*Math.PI*3)),-10.42).castShadow=false}
for(let i=0;i<18;i++){const f=i/17;mesh(world,sph(0.1),i%2?bulbB:bulbA,-13.66,5.95-0.38*Math.abs(Math.sin(f*Math.PI*3)),-10.2+f*12.2).castShadow=false}
// wall frames
[[-4.6,'#f7a6bf'],[-1.4,'#a6cff2']].forEach(([z,c])=>{box(world,0.12,1.5,1.2,'#ffffff',-13.68,3.4,z,0.05);box(world,0.06,1.2,0.9,c,-13.6,3.55,z,0.02)});

/* ---------- Hot (clickable) items ---------- */
const hot=[],targets=[];
function badgeDraw(x){x.clearRect(0,0,128,128);x.fillStyle='#ffffff';x.beginPath();x.arc(64,64,60,0,7);x.fill();x.fillStyle='#ffd76e';x.beginPath();x.arc(64,64,52,0,7);x.fill();
 x.strokeStyle='#eab547';x.lineWidth=6;x.beginPath();x.arc(64,64,40,0,7);x.stroke();x.fillStyle='#8a5a12';x.font='700 60px Fredoka, sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('$',64,68)}
const badge=canvasTex(128,128,badgeDraw);
function reg(g,id,opt={}){
 world.updateMatrixWorld(true);
 const bb=new THREE.Box3().setFromObject(g),size=bb.getSize(new THREE.Vector3()),ctr=bb.getCenter(new THREE.Vector3());
 const h={id,g,kind:opt.kind||'bill',mats:[],base:g.scale.x,phase:rnd()*6,ctr,status:'ok'};
 g.traverse(o=>{if(!o.isMesh)return;o.userData.hot=h;targets.push(o);if(o.material.emissive&&!o.userData.keep){o.material=o.material.clone();h.mats.push(o.material)}});
 if(h.kind==='bill'){
  if(!opt.wall){const r=Math.max(size.x,size.z)*0.6+0.3;
   const ring=new THREE.Mesh(new THREE.RingGeometry(r*0.8,r,48),B('#5fc9a4',{transparent:true,opacity:.5,depthWrite:false}));
   ring.rotation.x=-Math.PI/2;ring.position.set(ctr.x,(opt.floorY!=null?opt.floorY:bb.min.y)+0.03,ctr.z);world.add(ring);h.ring=ring}
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:badge.t,depthTest:false,transparent:true}));
  s.renderOrder=10;s.scale.set(.95,.95,1);s.position.set(ctr.x+(opt.bx||0),bb.max.y+0.8,ctr.z+(opt.bz||0));
  s.userData.hot=h;s.userData.y=s.position.y;world.add(s);h.badge=s;targets.push(s)}
 hot.push(h);return h}
function hitBox(g,w,h,d,y=0){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),B('#000',{transparent:true,opacity:0,depthWrite:false}));m.position.y=y+h/2;m.userData.keep=true;g.add(m);return m}

/* Kitchen */
{const g=grp(world,-12.8,0.3,-9.7);box(g,1.7,4.1,1.5,'#bfe4d6',0,0,0,0.2);box(g,1.72,0.05,1.52,'#9fcdbb',0,2.65,0,0.02);
 box(g,0.1,0.8,0.1,'#ffffff',0.55,2.95,0.78,0.04);box(g,0.1,1.1,0.1,'#ffffff',0.55,1.25,0.78,0.04);
 [['#f7a6bf',-0.3,3.3],['#ffd76e',0.1,3.6],['#a6cff2',-0.2,1.9]].forEach(([c,x,y])=>mesh(g,sph(0.09),c,x,y,0.76));

  .map(([l,v,c])=>`<div class="stat ${c||''}"><span>${l}</span><b>${fmt(v)}</b></div>`).join('');
 document.querySelectorAll('#months button').forEach((b,i)=>b.setAttribute('aria-pressed',i===month));
 if(selected)showDetail(selected);else if(sheet.classList.contains('open'))showList();
}
const mEl=document.getElementById('months');
mEl.innerHTML=MONTHS.map((m,i)=>`<button type="button" data-m="${i}">${m}</button>`).join('');
mEl.addEventListener('click',e=>{const b=e.target.closest('button');if(b){month=+b.dataset.m;applyMonth()}});

/* ---------- Sheet ---------- */
const sheet=document.getElementById('sheet');let selected=null;
function histHTML(arr,cur){const mx=Math.max(...arr,1);return `<div class="hist">${arr.map((v,i)=>`<div class="${i===cur?'cur':''}"><em>${fmt(v)}</em><i style="height:${Math.max(6,v/mx*70)}px"></i>${MONTHS[i]}</div>`).join('')}</div>`}
function showDetail(h){
 let html='';
 if(h.kind==='bill'){const b=bill(h.id),v=b.a[month],d=v-b.budget,over=d>0;
  html=`<div class="sh-top"><span class="tag">${esc(b.cat)}</span><button class="x" data-close aria-label="Close">×</button></div>
  <h2>${esc(b.name)}</h2><p class="where">${esc(b.where)} · due ${esc(b.due)}</p>
  <div class="big"><b>${fmt(v)}</b><span class="pill ${over?'over':'ok'}">${d===0?'Right on budget':over?fmt(d)+' over budget':fmt(-d)+' under budget'}</span></div>
  <div class="meter ${over?'over':''}"><i style="width:${Math.min(100,v/b.budget*100)}%"></i></div>
  <p class="sub">Budget ${fmt(b.budget)} a month · ${(v/INCOME[month]*100).toFixed(1)}% of take-home pay</p>
  ${histHTML(b.a,month)}<p class="note">${esc(b.note)}</p>`}
 else{const g=h.goal,v=g.a[month],bal=balance(g,month),n=seeds(g,month),met=v>=g.target,left=Math.max(0,g.goal-bal),mo=Math.ceil(left/g.target);
  html=`<div class="sh-top"><span class="tag">Savings goal</span><button class="x" data-close aria-label="Close">×</button></div>
  <h2>${esc(g.name)}</h2><p class="where">Garden row ${GOALS.indexOf(g)+1} · ${n} of ${SLOTS} seeds planted in ${MONTHS[month]}</p>
  <div class="big"><b>${fmt(v)}</b><span class="pill ${met?'ok':'over'}">${met?(v>g.target?fmt(v-g.target)+' above target':'Target met'):fmt(g.target-v)+' short of target'}</span></div>
  <div class="meter"><i style="width:${Math.min(100,bal/g.goal*100)}%"></i></div>
  <p class="sub">${fmt(bal)} saved of ${fmt(g.goal)} · target ${fmt(g.target)} a month</p>
  ${histHTML(g.a,month)}<p class="note">${left?`At ${fmt(g.target)} a month you reach this goal in about ${mo} month${mo===1?'':'s'}.`:'Goal reached. Time to pick the next one.'} Saving the monthly target plants ${FULL} seeds; extra fills the row.</p>`}
 sheet.innerHTML=html;openSheet()}
function showList(){selected=null;
 const rows=BILLS.slice().sort((a,b)=>b.a[month]-a.a[month]).map(b=>{const over=b.a[month]>b.budget;return `<button class="row" data-id="${b.id}"><span class="d" style="background:${over?'#f0707a':'#5fc9a4'}"></span><span>${esc(b.name)}<small>${esc(b.where)}</small></span><b>${fmt(b.a[month])}</b></button>`}).join('');
 const gr=GOALS.map(g=>`<button class="row" data-id="${g.id}"><span class="d" style="background:${g.color}"></span><span>${esc(g.name)}<small>${seeds(g,month)} seeds planted</small></span><b>${fmt(g.a[month])}</b></button>`).join('');
 sheet.innerHTML=`<div class="sh-top"><span class="tag">${MONTHS[month]} 2026</span><button class="x" data-close aria-label="Close">×</button></div><h2>Everything this month</h2>
 <div class="list"><h3>Bills, largest first</h3>${rows}<h3>Garden rows</h3>${gr}</div>`;openSheet();flyTo(null)}
function openSheet(){sheet.classList.add('open');document.body.classList.add('sheet-open')}
function close(){sheet.classList.remove('open');document.body.classList.remove('sheet-open');selected=null;flyTo(null)}
sheet.addEventListener('click',e=>{if(e.target.closest('[data-close]'))return close();const r=e.target.closest('[data-id]');if(r)select(r.dataset.id)});
document.getElementById('allBtn').addEventListener('click',showList);
addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='ArrowLeft'&&month>0){month--;applyMonth()}if(e.key==='ArrowRight'&&month<2){month++;applyMonth()}});

const tmp=new THREE.Vector3();
function flyTo(h){if(!h){focusGoal.copy(HOME);zoomGoal=baseZoom;return}
 world.localToWorld(tmp.copy(h.ctr));const z=Math.max(zoomGoal,baseZoom*1.7);zoomGoal=z;
 const up=new THREE.Vector3(0,1,0).applyQuaternion(cam.quaternion),right=new THREE.Vector3(1,0,0).applyQuaternion(cam.quaternion);
 const wide=innerWidth>=900,ext=halfH/z;focusGoal.copy(tmp);
 if(wide)focusGoal.addScaledVector(right,ext*(innerWidth/innerHeight)*0.35);else focusGoal.addScaledVector(up,-ext*0.42)}
function select(id){const h=byId[id];if(!h)return;selected=h;showDetail(h);flyTo(h)}

/* ---------- Input ---------- */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),ptrs=new Map();
let downX=0,downY=0,moved=false,rotY=0,pinch0=0,zoom0=1,hoverQ=null;
function hit(e){const r=canvas.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(ndc,cam);
 for(const x of ray.intersectObjects(targets,false))if(x.object.userData.hot)return x.object.userData.hot;return null}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptrs.size===1){downX=e.clientX;downY=e.clientY;moved=false}else{const [a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y)||1;zoom0=zoomGoal;moved=true}});
canvas.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);
 if(!p){if(e.pointerType==='mouse'&&!hoverQ){hoverQ=e;requestAnimationFrame(()=>{canvas.style.cursor=hit(hoverQ)?'pointer':'grab';hoverQ=null})}return}
 const dx=e.clientX-p.x;p.x=e.clientX;p.y=e.clientY;
 if(ptrs.size>=2){const [a,b]=[...ptrs.values()];zoomGoal=clamp(zoom0*Math.hypot(a.x-b.x,a.y-b.y)/pinch0,baseZoom*0.8,baseZoom*3.2);return}
 if(Math.hypot(e.clientX-downX,e.clientY-downY)>7)moved=true;
 if(moved){rotY=clamp(rotY+dx*0.006,-0.85,0.85);world.rotation.y=rotY;canvas.style.cursor='grabbing'}});
function up(e){const had=ptrs.delete(e.pointerId);if(had&&!moved&&ptrs.size===0&&e.type==='pointerup'){const h=hit(e);if(h)select(h.id);else if(selected)close()}if(!ptrs.size)canvas.style.cursor='grab'}
canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
canvas.addEventListener('wheel',e=>{e.preventDefault();zoomGoal=clamp(zoomGoal*Math.exp(-e.deltaY*0.0015),baseZoom*0.8,baseZoom*3.2)},{passive:false});

/* ---------- Resize & loop ---------- */
function resize(){const w=innerWidth,h=innerHeight,a=w/h;renderer.setSize(w,h,false);
 halfH=Math.max(15.2,19.6/a);const top=halfH*(a<1?1.0:1.1),bot=halfH*(a<1?1.0:0.9);
 cam.left=-halfH*a;cam.right=halfH*a;cam.top=top;cam.bottom=-bot;
 const nb=a<0.8?1.08:1;if(nb!==baseZoom){zoomGoal*=nb/baseZoom;zoom*=nb/baseZoom;baseZoom=nb}cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();zoom=zoomGoal=baseZoom;

const clock=new THREE.Clock();let first=true;
function tick(){const dt=Math.min(clock.getDelta(),0.05),t=clock.elapsedTime,k=1-Math.exp(-dt*5);
 focus.lerp(focusGoal,k);zoom+=(zoomGoal-zoom)*k;cam.position.copy(focus).add(OFF);cam.lookAt(focus);cam.zoom=zoom;cam.updateProjectionMatrix();
 for(const h of hot){
  if(h.kind==='goal'){h.g.rotation.z=reduce?0:Math.sin(t*1.3+h.phase)*0.05;const gs=selected===h?1.2:1;h.g.scale.setScalar(h.g.scale.x+(gs-h.g.scale.x)*k);continue}
  const sp=h.status==='over'?5.4:3.2,s=reduce?0.6:(Math.sin(t*sp+h.phase)+1)/2,sel=selected===h;
  h.g.scale.setScalar(h.base*(1+(sel?0.06:0.045*s)));
  for(const m of h.mats)m.emissiveIntensity=sel?0.32:0.06+0.24*s;
  if(h.ring){h.ring.material.opacity=sel?0.95:0.22+0.45*s;h.ring.scale.setScalar(1+0.08*s)}
  h.badge.position.y=h.badge.userData.y+(reduce?0:Math.sin(t*2+h.phase)*0.13);h.badge.scale.setScalar(0.88+0.14*s)}
 for(const s of slots){if(s.delay>0){s.delay-=dt;continue}s.cur+=(s.target-s.cur)*(1-Math.exp(-dt*(s.target?6:9)));
  const v=s.target?Math.min(1,s.cur*1.08+Math.sin(s.cur*Math.PI)*0.12):s.cur;s.g.scale.setScalar(Math.max(0.001,v));s.g.visible=v>0.01;s.g.rotation.z=reduce?0:Math.sin(t*1.6+s.phase)*0.05}
 routerLed.material.color.set(Math.sin(t*6)>0?'#6be3a8':'#2f9e6c');
 for(const f of flies){const a=reduce?f.ph:t*0.5+f.ph;f.g.position.set(f.x+Math.cos(a)*1.6,2.6+Math.sin(t*1.7+f.ph)*0.4,f.z+Math.sin(a*1.3)*1.4);f.g.rotation.y=-a;const fl=reduce?0.4:Math.sin(t*14+f.ph)*0.9;f.p1.rotation.z=fl;f.p2.rotation.z=-fl}
 renderer.render(scene,cam);
 if(first){first=false;const l=document.getElementById('loading');l.style.opacity=0;setTimeout(()=>l.remove(),600)}
 requestAnimationFrame(tick)}
applyMonth();
for(const s of slots){s.cur=s.target;s.delay=0}
if(document.fonts)document.fonts.ready.then(()=>{badgeDraw(badge.c.getContext('2d'));badge.t.needsUpdate=true;GOALS.forEach(g=>packetDraw(g,month))});
tick();
}
</script>
</body>
</html>
